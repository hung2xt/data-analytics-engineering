version: 2

sources:
  - name: fox_dwh
    description: >
      Real tables already sitting in the `public` schema of the fox_dwh
      Postgres database (loaded by other pipelines you built — Kafka/Flink,
      etc.). We only *read* from here; all dbt models are built into the
      `analytical_engineer` schema instead.
    schema: public
    tables:
      - name: enriched_orders
        description: >
          One row per order line, already denormalized: customer info,
          product info and order info are all flattened into a single wide
          table. Good example of a "one big table" export you have to
          re-normalize into a proper staging/marts model.
        loaded_at_field: created_at
        freshness:
          warn_after: {count: 7, period: day}
          error_after: {count: 30, period: day}
        columns:
          - name: order_id
            tests:
              - unique
              - not_null
